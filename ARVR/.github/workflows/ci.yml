name: "CI Pipeline (Quality, Tests & Container Security)"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ----------------------------------------------------------------------------
  # Stage 1: Static Code Quality & TypeScript Type Checking
  # ----------------------------------------------------------------------------
  static-checks:
    name: "Lint & Typecheck"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run typecheck

  # ----------------------------------------------------------------------------
  # Stage 2: Dependency Security Audit
  # ----------------------------------------------------------------------------
  security-audit:
    name: "Dependency Vulnerability Audit"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Run NPM Security Audit
        run: npm audit --audit-level=high

  # ----------------------------------------------------------------------------
  # Stage 3: Functional, Security Hardening & Storage Tests
  # ----------------------------------------------------------------------------
  tests:
    name: "Test Suites"
    needs: [static-checks]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: arvr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Schema Migrations Against Test DB
        env:
          DATABASE_URL: "postgresql://postgres:password@127.0.0.1:5432/arvr_test?schema=public"
        run: npx prisma migrate deploy

      - name: Execute End-to-End Application Feature Tests
        env:
          DATABASE_URL: "postgresql://postgres:password@127.0.0.1:5432/arvr_test?schema=public"
          REDIS_URL: "redis://127.0.0.1:6379"
          SESSION_SECRET: "test_session_secret_32_characters_minimum_length"
        run: npm run test

      - name: Execute DevSecOps & Security Hardening Suite
        env:
          DATABASE_URL: "postgresql://postgres:password@127.0.0.1:5432/arvr_test?schema=public"
          REDIS_URL: "redis://127.0.0.1:6379"
          SESSION_SECRET: "test_session_secret_32_characters_minimum_length"
        run: npm run test:security

  # ----------------------------------------------------------------------------
  # Stage 4: Docker Build & Aquasec Trivy Vulnerability Scan
  # ----------------------------------------------------------------------------
  docker-scan:
    name: "Docker Build & Trivy CVE Scan"
    needs: [static-checks, security-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image Locally
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: arvr-academy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Image with Aquasec Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: arvr-academy:${{ github.sha }}
          format: 'table'
          exit-code: '1' # Fails build if CRITICAL or HIGH vulnerabilities are detected
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
